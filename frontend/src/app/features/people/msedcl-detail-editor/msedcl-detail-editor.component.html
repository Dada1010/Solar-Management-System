<form *ngIf="canWrite" [formGroup]="form" (ngSubmit)="submit()" class="form-grid msedcl-form">
	<label>Billing unit<input pInputText formControlName="billingUnit" maxlength="50"></label>
	<label>Consumer name<input pInputText formControlName="name" maxlength="100"></label>
	<label>Mobile number<input pInputText type="tel" formControlName="mobileNo" maxlength="40"></label>
	<label>Consumer number<input pInputText formControlName="consumerNo" maxlength="50"></label>
	<label>Rate per unit<input pInputText type="number" min="0" step="0.0001" formControlName="ratePerUnit"></label>
	<label>Due days<input pInputText type="number" min="0" max="365" step="1" formControlName="dueDays"></label>
	<label>Charge type<select formControlName="chargeType"><option value="ONLY_SOLAR_GENERATION">Only Solar generation</option><option value="SOLAR_PLUS_MSEB_BILL_AMOUNT">Solar + MSEB bill amount</option></select></label>
	<div class="form-actions wide" *ngIf="canWrite">
		<p-button *ngIf="detail" label="Cancel edit" severity="secondary" [outlined]="true" type="button" (onClick)="cancel()"></p-button>
		<p-button [label]="detail ? 'Save changes' : 'Add detail'" icon="pi pi-check" type="submit" [loading]="saving" [disabled]="form.invalid"></p-button>
	</div>
</form>
