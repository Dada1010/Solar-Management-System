<p-button label="Rates" icon="pi pi-chart-line" severity="secondary" [outlined]="true" (onClick)="open()"></p-button>
<p-dialog [(visible)]="dialogVisible" [header]="'Effective rates' + (ownerName ? ' · ' + ownerName : '')" [modal]="true" [draggable]="false" [style]="{ width: 'min(48rem, 96vw)' }">
	<form *ngIf="canWrite" [formGroup]="form" (ngSubmit)="save()" class="rate-form">
		<label>Start date<input pInputText type="date" formControlName="startDate"></label>
		<label>Rate per unit<input pInputText type="number" min="0" step="0.0001" formControlName="ratePerUnit"></label>
		<div class="form-actions"><p-button *ngIf="editingId !== null" label="Cancel edit" severity="secondary" [outlined]="true" type="button" (onClick)="resetForm()"></p-button><p-button [label]="editingId === null ? 'Add rate' : 'Save changes'" icon="pi pi-check" type="submit" [loading]="saving" [disabled]="form.invalid"></p-button></div>
	</form>
	<section class="rate-history" aria-label="Effective rate history">
		<div class="rate-history-heading"><strong>Rate history</strong><span>{{ rates.length }} entries</span></div>
		<div class="rate-loading" *ngIf="loading" role="status">Loading rates…</div>
		<p-table *ngIf="!loading" [value]="rates" [rowHover]="true" responsiveLayout="scroll" [tableStyle]="{ 'min-width': '30rem' }">
			<ng-template pTemplate="header"><tr><th>Start date</th><th>Rate per unit</th><th *ngIf="canWrite || canDelete" class="rate-actions">Actions</th></tr></ng-template>
			<ng-template pTemplate="body" let-rate><tr><td>{{ rate.startDate }}</td><td>{{ rate.ratePerUnit | number:'1.2-4' }}</td><td *ngIf="canWrite || canDelete" class="rate-actions"><p-button *ngIf="canWrite" icon="pi pi-pencil" [text]="true" severity="secondary" aria-label="Edit effective rate" (onClick)="edit(rate)"></p-button><p-button *ngIf="canDelete" icon="pi pi-trash" [text]="true" severity="danger" aria-label="Remove effective rate" (onClick)="remove(rate)"></p-button></td></tr></ng-template>
			<ng-template pTemplate="emptymessage"><tr><td colspan="3" class="empty-cell">No effective rates added.</td></tr></ng-template>
		</p-table>
	</section>
</p-dialog>
